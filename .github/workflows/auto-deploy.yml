name: 🚀 Deploy DocFlow (Auto)

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get Kudu Credentials
        id: creds
        run: |
          CREDS=$(az functionapp deployment list-publishing-profiles \
            --name doc-automation-func \
            --resource-group doc-automation-rg \
            --query "[0].{user: userName, pass: userPWD}" \
            --output json)

          USER=$(echo $CREDS | jq -r '.user')
          PASS=$(echo $CREDS | jq -r '.pass')

          echo "::add-mask::$USER"
          echo "::add-mask::$PASS"
          echo "user=$USER" >> $GITHUB_OUTPUT
          echo "pass=$PASS" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install & Test
        run: npm ci && npm test

      - name: Build Deployment Package
        run: zip -r deploy.zip . -x "node_modules/*" ".git/*" ".github/*"

      - name: Deploy via Kudu (Upload)
        run: |
          B64=$(echo -n "${{ steps.creds.outputs.user }}:${{ steps.creds.outputs.pass }}" | base64 -w 0)

          curl -X POST \
            -H "Authorization: Basic $B64" \
            -H "Content-Type: application/octet-stream" \
            --data-binary "@deploy.zip" \
            "https://doc-automation-func.scm.azurewebsites.net/api/zipdeploy?isAsync=false" \
            -v --max-time 600

      - name: Install Dependencies (Kudu)
        run: |
          B64=$(echo -n "${{ steps.creds.outputs.user }}:${{ steps.creds.outputs.pass }}" | base64 -w 0)

          curl -X POST \
            -H "Authorization: Basic $B64" \
            -H "Content-Type: application/json" \
            -d '{"command":"npm install","dir":"site/wwwroot"}' \
            "https://doc-automation-func.scm.azurewebsites.net/api/command" \
            -v

      - name: Wait for App Startup
        run: |
          echo "⏳ Waiting for app to start..."
          for i in {1..120}; do
            if curl -s -k https://doc-automation-func.azurewebsites.net/api/health | grep -q "healthy\|UP\|OK"; then
              echo "✅ App is healthy!"
              exit 0
            fi
            echo "[$i/120] Still starting..."
            sleep 5
          done
          echo "❌ App startup timeout"
          curl -s -k https://doc-automation-func.azurewebsites.net/api/health
          exit 1

      - name: Test Webhook
        run: |
          echo "Testing webhook endpoint..."
          curl -s -k https://doc-automation-func.azurewebsites.net/api/mondayWebhook \
            -H "Content-Type: application/json" \
            -d '{"test":true}' \
            -v

      - name: Success! 🎉
        run: |
          echo "✅ DEPLOYMENT COMPLETE"
          echo ""
          echo "🔗 Webhook URL (wire to Monday):"
          echo "https://doc-automation-func.azurewebsites.net/api/mondayWebhook"
