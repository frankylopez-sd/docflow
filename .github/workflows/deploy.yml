name: Deploy DocFlow to Azure

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install & Test
        run: npm ci && npm test

      - name: Build deployment package
        run: node scripts/build-shims.js

      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: doc-automation-func
          package: deploy-stage
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}

      - name: Smoke test
        run: |
          echo "Waiting for app to warm..."
          sleep 30
          for i in {1..10}; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" https://doc-automation-func.azurewebsites.net/api/health)
            if [ "$CODE" = "200" ]; then
              echo "health: 200 OK"
              exit 0
            fi
            echo "[$i/10] health returned $CODE, retrying..."
            sleep 15
          done
          echo "health check failed"
          exit 1
