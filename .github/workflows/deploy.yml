name: Deploy DocFlow to Azure

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install & Test
        run: npm ci && npm test

      - name: Build deployment package
        run: node scripts/build-shims.js

      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: doc-automation-func
          package: deploy-stage
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}

      # The worker has repeatedly wedged into a permanent 503 after the zip
      # swap (2026-08-21/22); a host restart clears it every time. Bounce the
      # Functions host via Kudu using the publish-profile credentials.
      - name: Restart Functions host
        run: |
          PROFILE='${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}'
          USER=$(echo "$PROFILE" | grep -o 'userName="[^"]*"' | head -1 | cut -d'"' -f2)
          PASS=$(echo "$PROFILE" | grep -o 'userPWD="[^"]*"' | head -1 | cut -d'"' -f2)
          curl -s -u "$USER:$PASS" -X POST \
            "https://doc-automation-func.scm.azurewebsites.net/api/functions/host/restart" \
            -o /dev/null -w "host restart: %{http_code}\n"

      - name: Smoke test
        run: |
          echo "Waiting for app to warm..."
          sleep 30
          for i in {1..10}; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" https://doc-automation-func.azurewebsites.net/api/health)
            if [ "$CODE" = "200" ]; then
              echo "health: 200 OK"
              exit 0
            fi
            echo "[$i/10] health returned $CODE, retrying..."
            sleep 15
          done
          echo "health check failed"
          exit 1
