name: Deploy with Azure Auth

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get Publish Profile
        id: publish
        run: |
          PROFILE=$(az functionapp deployment list-publishing-profiles \
            --name doc-automation-func \
            --resource-group doc-automation-rg \
            --query "[?publishMethod=='MSDeploy'].{username: userName, password: userPWD}" \
            --output tsv)

          IFS=$'\t' read -r USER PASS <<< "$PROFILE"
          echo "::add-mask::$USER"
          echo "::add-mask::$PASS"
          echo "user=$USER" >> $GITHUB_OUTPUT
          echo "pass=$PASS" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install & Test
        run: npm ci && npm test

      - name: Build package
        run: zip -r deploy.zip . -x "node_modules/*" ".git/*" ".github/*"

      - name: Deploy via Kudu
        run: |
          B64=$(echo -n "${{ steps.publish.outputs.user }}:${{ steps.publish.outputs.pass }}" | base64 -w 0)

          curl -X POST \
            -H "Authorization: Basic $B64" \
            -H "Content-Type: application/octet-stream" \
            --data-binary "@deploy.zip" \
            "https://doc-automation-func.scm.azurewebsites.net/api/zipdeploy?isAsync=false" \
            -v

      - name: Install Dependencies (via Kudu)
        run: |
          B64=$(echo -n "${{ steps.publish.outputs.user }}:${{ steps.publish.outputs.pass }}" | base64 -w 0)

          curl -X POST \
            -H "Authorization: Basic $B64" \
            -H "Content-Type: application/json" \
            -d '{"command":"npm install","dir":"site/wwwroot"}' \
            "https://doc-automation-func.scm.azurewebsites.net/api/command" \
            -v

      - name: Wait for App Startup
        run: |
          for i in {1..60}; do
            if curl -s https://doc-automation-func.azurewebsites.net/api/health -k | grep -q "healthy\|OK"; then
              echo "✅ App is healthy"
              exit 0
            fi
            echo "Waiting... $i/60"
            sleep 3
          done
          echo "❌ Timeout"
          exit 1
